<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — AlgoArena</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <nav>
        <h1>⚔️ AlgoArena</h1>
    </nav>

    <div class="container">
        <div class="form-card" style="margin: 60px auto;">
            <h2 style="margin-bottom: 24px; color: #7c6aff;">Welcome Back</h2>
            {% if error %}
            <div style="color: #f87171; margin-bottom: 16px; font-size: 0.9rem;">{{ error }}</div>
            {% endif %}
            <form method="POST">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter password" required>
                </div>
                <button type="submit">Login ⚔️</button>
            </form>
            <p style="margin-top: 16px; color: #888; font-size: 0.9rem;">
                Don't have an account?
                <a href="/register" style="color: #7c6aff;">Register here</a>
            </p>
        </div>
    </div>
</body>

</html>
